name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.15.3-pg16
        env:
          POSTGRES_USER: grd
          POSTGRES_PASSWORD: grd
          POSTGRES_DB: grd_stk_mkt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-real-0123456789
      POSTGRES_HOST: localhost
      POSTGRES_USER: grd
      POSTGRES_PASSWORD: grd
      POSTGRES_DB: grd_stk_mkt
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: local
      EMBEDDINGS_PROVIDER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Tests
        run: pytest -q

      # ── database: migrations must apply, roll back, and match the models ──
      - name: Migrations apply from empty
        run: alembic upgrade head

      - name: Every downgrade() works
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations (no un-generated changes)
        run: alembic check
