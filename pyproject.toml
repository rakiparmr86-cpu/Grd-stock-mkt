[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grd-stk-mkt"
version = "0.1.0"
description = "Multi-agent stock-market analysis platform"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # DB
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Auth
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    # Tasks
    "celery>=5.3",
    "redis>=5.0",
    # Data / calculations
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "httpx>=0.27",
    # RAG / inputs
    "qdrant-client>=1.9",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tabulate>=0.9",  # pandas.DataFrame.to_markdown (excel→docs connector)
    # Agents
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Reports
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "freezegun>=1.5",
]
pdf = ["weasyprint>=61.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.3"]  # image_ocr connector, backend="tesseract"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # dev/test SECRET_KEY is short by design; real deploys set a long one
    "ignore:The HMAC key is:UserWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
